name: 使用反馈
description: 反馈使用问题或改进建议
body:
  - type: input
    id: version
    attributes:
      label: 程序版本
      placeholder: 例如 1.1.0-beta.2
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 电脑系统和芯片
      placeholder: 例如 Windows 11 Intel / macOS Apple Silicon
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤与结果
      description: 请说明点了什么、期望结果、实际结果和提示原文。公开附件请去除不需要公开的客户资料。
    validations:
      required: true
